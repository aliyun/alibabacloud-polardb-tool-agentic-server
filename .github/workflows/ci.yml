name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.8.15"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test backend
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, postgresql]
    services:
      mysql:
        image: mysql:8.0.44@sha256:9c3380eac945af0736031b200027f581925927c81e010056214a4bd6b6693714
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: pas
          MYSQL_USER: pas
          MYSQL_PASSWORD: pas-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:16.8-bookworm@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
        env:
          POSTGRES_DB: pas
          POSTGRES_USER: pas
          POSTGRES_PASSWORD: pas-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=pas --dbname=pas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.8.15"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check single Alembic head
        run: scripts/ci/check-alembic-head.sh
      - name: Test migrations
        run: scripts/ci/test-migrations.sh ${{ matrix.database }}

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          tags: polardb-agentic-server:ci
      - name: Validate Compose configurations
        env:
          PAS_IMAGE: polardb-agentic-server:ci
          PAS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_PASSWORD: test-pas-password
          PAS_DATABASE_URL: mysql+asyncmy://pas:test-pas-password@database.example:3306/pas
        run: |
          docker compose config --quiet
          docker compose -f deploy/compose/compose.external-mysql.yaml config --quiet
          docker compose -f deploy/compose/compose.external-postgres.yaml config --quiet

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.18.4
      - name: Lint Chart
        run: helm lint deploy/helm/polardb-agentic-server
      - name: Render Chart
        run: helm template ci deploy/helm/polardb-agentic-server >/dev/null

  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.8.15"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Validate public snapshot commit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: python scripts/release/validate-public-commit.py "$GITHUB_SHA"
      - name: Test public metadata and documentation
        run: >-
          uv run pytest
          tests/test_public_docs.py
          tests/test_security_metadata.py
          tests/test_dependency_license_policy.py
          tests/test_public_export.py
      - name: Check dependency licenses
        run: python scripts/security/generate-license-report.py --check
      - name: Check sanitized export
        run: scripts/public-release/export.sh --check
