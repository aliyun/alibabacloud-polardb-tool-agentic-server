name: Recover Incomplete Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      expected_commit:
        description: Expected full commit SHA for the tag
        required: true
        type: string
      dry_run:
        description: Validate only; do not create a GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: recover-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aliyun/alibabacloud-polardb-tool-agentic-server
  CHART: oci://ghcr.io/aliyun/charts/polardb-agentic-server
  RECOVERY_TAG: ${{ inputs.tag }}
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out current recovery tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: tools
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          path: tagged
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.18.4
      - name: Validate immutable recovery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/scripts/release/recovery-check.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RECOVERY_TAG" \
            --expected-commit "$EXPECTED_COMMIT" \
            --source "$GITHUB_WORKSPACE/tagged" \
            --image "$IMAGE" \
            --chart "$CHART" \
            --dry-run >"$RUNNER_TEMP/recovery.json"
          {
            echo "### Recovery dry run"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/recovery.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  recover:
    if: ${{ inputs.dry_run == false }}
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Check out current recovery tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: tools
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          path: tagged
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.18.4
      - name: Log in to GHCR for existing image reads
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Revalidate and prepare immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/scripts/release/recovery-check.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RECOVERY_TAG" \
            --expected-commit "$EXPECTED_COMMIT" \
            --source "$GITHUB_WORKSPACE/tagged" \
            --image "$IMAGE" \
            --chart "$CHART" \
            --dry-run >"$RUNNER_TEMP/recovery.json"
          version="$RECOVERY_TAG"
          version="${version#v}"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "ASSET_DIR=$RUNNER_TEMP/release-assets" >>"$GITHUB_ENV"
          echo "INDEX_DIGEST=$(jq -r .image_index_digest "$RUNNER_TEMP/recovery.json")" \
            >>"$GITHUB_ENV"
          cp tools/scripts/release/build-deployment-bundle.sh \
            tagged/scripts/release/build-deployment-bundle.sh
          cp tools/scripts/release/check-assets.py \
            tagged/scripts/release/check-assets.py
      - name: Package tagged deployment inputs
        working-directory: tagged
        run: |
          mkdir -p "$ASSET_DIR"
          scripts/release/build-deployment-bundle.sh \
            "$VERSION" "$ASSET_DIR"
      - name: Save existing platform images
        run: |
          tools/scripts/release/save-image-archive.sh \
            --image "$IMAGE@$INDEX_DIGEST" \
            --platform linux/amd64 \
            --version "$VERSION" \
            --revision "$EXPECTED_COMMIT" \
            --output "$ASSET_DIR/polardb-agentic-server-$VERSION-image-linux-amd64.tar.gz"
          tools/scripts/release/save-image-archive.sh \
            --image "$IMAGE@$INDEX_DIGEST" \
            --platform linux/arm64 \
            --version "$VERSION" \
            --revision "$EXPECTED_COMMIT" \
            --output "$ASSET_DIR/polardb-agentic-server-$VERSION-image-linux-arm64.tar.gz"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      - name: Generate SBOM and checksums
        run: |
          syft "$IMAGE@$INDEX_DIGEST" \
            -o "spdx-json=$ASSET_DIR/polardb-agentic-server-$VERSION.spdx.json"
          (
            cd "$ASSET_DIR"
            sha256sum \
              "polardb-agentic-server-$VERSION-chart.tgz" \
              "polardb-agentic-server-$VERSION-deploy.tar.gz" \
              "polardb-agentic-server-$VERSION-image-linux-amd64.tar.gz" \
              "polardb-agentic-server-$VERSION-image-linux-arm64.tar.gz" \
              "polardb-agentic-server-$VERSION.spdx.json" \
              | sort -k2 >SHA256SUMS
          )
          python tools/scripts/release/check-assets.py verify \
            --version "$VERSION" --directory "$ASSET_DIR"
      - name: Attest recovered assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ runner.temp }}/release-assets/*
      - name: Create Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RECOVERY_TAG" "$ASSET_DIR"/* \
            --verify-tag \
            --draft \
            --prerelease \
            --generate-notes \
            --title "$RECOVERY_TAG"
          gh release view "$RECOVERY_TAG" --json url --jq .url \
            >>"$GITHUB_STEP_SUMMARY"
