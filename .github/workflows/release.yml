name: Draft Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aliyun/alibabacloud-polardb-tool-agentic-server

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify tag is on public main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.8.15"
          enable-cache: true
      - name: Verify release version
        run: |
          version=$(python scripts/release/verify-version.py "$GITHUB_REF_NAME")
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "ASSET_DIR=$RUNNER_TEMP/release-assets" >>"$GITHUB_ENV"
      - name: Install test dependencies
        run: uv sync --locked --extra dev
      - name: Repeat release-critical gates
        run: |
          uv run ruff check .
          uv run pytest \
            tests/test_github_workflows.py \
            tests/test_release_assets.py \
            tests/test_public_docs.py \
            tests/test_security_metadata.py \
            tests/test_dependency_license_policy.py \
            tests/test_public_export.py
          scripts/public-release/export.sh --check
          python scripts/security/generate-license-report.py --check
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test Compose environment generation
        env:
          PAS_RUN_ENV_GENERATOR_MYSQL_TEST: "1"
          PAS_TEST_IMAGE: ${{ env.IMAGE }}:${{ env.VERSION }}
        run: uv run pytest tests/integration/test_env_generator_mysql.py -q
      - name: Verify anonymous image pull
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: Log back in for release packaging
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.18.4
      - name: Build deployment assets
        run: |
          mkdir -p "$ASSET_DIR"
          scripts/release/build-deployment-bundle.sh "$VERSION" "$ASSET_DIR"
      - name: Publish Helm OCI Chart
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm push \
            "$ASSET_DIR/polardb-agentic-server-$VERSION-chart.tgz" \
            oci://ghcr.io/aliyun/charts
          helm registry logout ghcr.io
          helm show chart \
            oci://ghcr.io/aliyun/charts/polardb-agentic-server \
            --version "$VERSION"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save platform image archives
        run: |
          index_manifest="$RUNNER_TEMP/release-image-index.json"
          docker buildx imagetools inspect --raw \
            "$IMAGE@${{ steps.build.outputs.digest }}" >"$index_manifest"
          amd64_digest=$(python scripts/release/resolve-platform-digest.py \
            --manifest "$index_manifest" --platform linux/amd64)
          arm64_digest=$(python scripts/release/resolve-platform-digest.py \
            --manifest "$index_manifest" --platform linux/arm64)
          scripts/release/save-image-archive.sh \
            --image "$IMAGE@${{ steps.build.outputs.digest }}" \
            --platform linux/amd64 \
            --version "$VERSION" \
            --revision "$GITHUB_SHA" \
            --output "$ASSET_DIR/polardb-agentic-server-$VERSION-image-linux-amd64.tar.gz"
          scripts/release/save-image-archive.sh \
            --image "$IMAGE@${{ steps.build.outputs.digest }}" \
            --platform linux/arm64 \
            --version "$VERSION" \
            --revision "$GITHUB_SHA" \
            --output "$ASSET_DIR/polardb-agentic-server-$VERSION-image-linux-arm64.tar.gz"
          {
            echo "### Release image digests"
            echo
            echo "| Manifest | Digest |"
            echo "| --- | --- |"
            echo "| index | \`${{ steps.build.outputs.digest }}\` |"
            echo "| linux/amd64 | \`$amd64_digest\` |"
            echo "| linux/arm64 | \`$arm64_digest\` |"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      - name: Generate SPDX SBOM and checksums
        run: |
          syft "$IMAGE@${{ steps.build.outputs.digest }}" \
            -o "spdx-json=$ASSET_DIR/polardb-agentic-server-$VERSION.spdx.json"
          (
            cd "$ASSET_DIR"
            sha256sum \
              "polardb-agentic-server-$VERSION-chart.tgz" \
              "polardb-agentic-server-$VERSION-deploy.tar.gz" \
              "polardb-agentic-server-$VERSION-image-linux-amd64.tar.gz" \
              "polardb-agentic-server-$VERSION-image-linux-arm64.tar.gz" \
              "polardb-agentic-server-$VERSION.spdx.json" \
              | sort -k2 >SHA256SUMS
          )
          python scripts/release/check-assets.py verify \
            --version "$VERSION" --directory "$ASSET_DIR"
      - name: Attest image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ runner.temp }}/release-assets/*
      - name: Create Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; published assets are immutable" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$ASSET_DIR"/* \
            --verify-tag \
            --draft \
            --prerelease \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
