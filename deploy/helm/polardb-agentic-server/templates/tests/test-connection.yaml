apiVersion: v1
kind: Pod
metadata:
  name: {{ include "polardb-agentic-server.fullname" . }}-test
  labels:
    {{- include "polardb-agentic-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: request
      image: {{ include "polardb-agentic-server.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://{{ include "polardb-agentic-server.fullname" . }}:{{ .Values.service.port }}/readyz",
          timeout=10)
      securityContext:
        {{- include "polardb-agentic-server.securityContext" . | nindent 8 }}
