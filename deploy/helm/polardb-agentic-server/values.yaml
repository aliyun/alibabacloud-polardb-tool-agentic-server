replicaCount: 2

image:
  repository: ghcr.io/aliyun/alibabacloud-polardb-tool-agentic-server
  tag: "0.0.1"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

existingSecret: pas-bootstrap

service:
  type: ClusterIP
  port: 18760

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pas.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 1

migration:
  enabled: true
  args:
    - database
    - migrate
  backoffLimit: 2
  activeDeadlineSeconds: 600

probes:
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: false
